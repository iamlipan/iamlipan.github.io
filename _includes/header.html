<header class="site-header">
  <div class="shell">
    <a class="site-brand" href="{{ "/" | prepend: site.baseurl }}">{{ site.title }}</a>

    <nav class="site-nav" aria-label="站点导航">
      <a class="nav-link" href="{{ "/archive/" | prepend: site.baseurl }}"
         {% if page.url == "/archive/" %}aria-current="page"{% endif %}>归档</a>
      <a class="nav-link" href="{{ "/about/" | prepend: site.baseurl }}"
         {% if page.url == "/about/" %}aria-current="page"{% endif %}>关于</a>
      <a class="nav-link" href="{{ "/links/" | prepend: site.baseurl }}"
         {% if page.url == "/links/" %}aria-current="page"{% endif %}>别点我</a>

      <a class="icon-btn" href="{{ "/search/" | prepend: site.baseurl }}" aria-label="搜索"
         {% if page.url == "/search/" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>
        </svg>
      </a>

      <button class="icon-btn theme-toggle" type="button" aria-label="切换深浅色主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 13.2A9 9 0 1110.8 3a7 7 0 1010.2 10.2z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
